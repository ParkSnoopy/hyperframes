name: Sync upstream skills

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: sync-upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: actions/checkout@v4 - Check Out Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: bash - Merge Skills and License
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          UPSTREAM_URL: https://github.com/heygen-com/hyperframes
          UPSTREAM_BRANCH: main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch "$UPSTREAM_URL" "$UPSTREAM_BRANCH"
          git merge --no-commit --no-ff FETCH_HEAD
          git restore --source=HEAD --staged --worktree -- .github/workflows
          git rm -r --force --ignore-unmatch -- . \
            ':(top,exclude)skills' \
            ':(top,exclude,literal)LICENSE' \
            ':(top,exclude).github/workflows'

          test -f skills/hyperframes/SKILL.md
          test -f LICENSE
          test -f .github/workflows/sync-upstream.yml
          test -z "$(git ls-files -- . \
            ':(top,exclude)skills' \
            ':(top,exclude,literal)LICENSE' \
            ':(top,exclude).github/workflows')"
          if git rev-parse --verify --quiet MERGE_HEAD >/dev/null || ! git diff --cached --quiet; then
            git commit -m 'chore: sync upstream skills'
            git push origin "HEAD:$TARGET_BRANCH"
          fi
